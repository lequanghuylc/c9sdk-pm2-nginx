# Cloud9 IDE served below the /ide sub path (must match C9_SUB_PATH, default "/ide").
# Include this file inside any server {} block to expose the IDE at <domain>/ide/:
#
#     include /etc/nginx/snippets/c9-ide.conf;
#
# The prefix is NOT stripped here: the IDE server (c9sdk with C9_SUB_PATH) handles it.

location = /ide {
  absolute_redirect off;
  return 302 /ide/;
}

# ^~ so regex locations of the main app (e.g. ~* \.(js|css)$) never catch IDE assets
location ^~ /ide/ {
  proxy_pass http://127.0.0.1:3399;
  client_max_body_size 100M;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  # terminal / file sync use long lived websocket connections
  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  proxy_buffering off;
}
