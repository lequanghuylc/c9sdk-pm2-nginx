server {
  listen 8080 default_server;

  access_log /var/log/nginx/reverse-access.log;
  error_log /var/log/nginx/reverse-error.log;

  # Cloud9 IDE -> http://<domain>/ide/
  include /etc/nginx/snippets/c9-ide.conf;

  # Main application -> http://<domain>/
  # While nothing listens on 3000 (no GIT_REPO deployed yet) a static welcome page is shown.
  location / {
    error_page 502 503 504 = @welcome;
    proxy_pass http://127.0.0.1:3000;
    client_max_body_size 100M;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  location @welcome {
    root /var/www/welcome;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
  }

}
